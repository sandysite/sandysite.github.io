<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>sandysite</title>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="topbar">
        <div class="custom-dropdown" id="themeDropdown">
            <div class="dropdown-selected">
                <span class="selected-text">Light</span>
            </div>
            <div class="dropdown-options">
                <div class="dropdown-option" data-theme="light">Light</div>
                <div class="dropdown-option" data-theme="dark">Dark</div>
                <div class="dropdown-option" data-theme="evil">Evil</div>
                <div class="dropdown-option" data-theme="forest">Forest</div>
                <div class="dropdown-option" data-theme="sand">Sand</div>
            </div>
        </div>
    </div>
</body>
</html>
